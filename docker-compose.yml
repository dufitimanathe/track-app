# NEXT_PUBLIC_* values are baked at image build time.
# After changing Google Maps key (or API URL), rebuild:
#   docker compose --env-file .env build --no-cache frontend
#   docker compose up -d frontend

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3000/api/v1}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-http://localhost:3000/realtime}
        NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${NEXT_PUBLIC_GOOGLE_MAPS_API_KEY:-}
        NEXT_PUBLIC_GOOGLE_MAPS_MAP_ID: ${NEXT_PUBLIC_GOOGLE_MAPS_MAP_ID:-}
        NEXT_PUBLIC_USE_LIVE_API: ${NEXT_PUBLIC_USE_LIVE_API:-true}
        NEXT_PUBLIC_DEFAULT_COMPANY_ID: ${NEXT_PUBLIC_DEFAULT_COMPANY_ID:-}
    image: motors-frontend:latest
    container_name: motors-frontend
    ports:
      - "3001:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:3000', (r) => { if (r.statusCode !== 200) throw new Error(String(r.statusCode)) })",
        ]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
